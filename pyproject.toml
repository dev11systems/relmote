[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "relmote"
version = "0.1.0.dev9"
description = "Portable, user-controlled intelligent interface node"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
pi = ["gpiozero>=2.0"]
screen-linux = ["dbus-next>=0.2.3"]

[project.scripts]
relmote = "relmote.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/relmote"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
